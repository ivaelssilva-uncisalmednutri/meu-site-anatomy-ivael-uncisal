<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumos de Anatomia Abdominal</title>
    <style>
        /* Importando uma fonte mais agradável do Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');

        /* Configurações gerais do corpo da página */
        body {
            font-family: 'Lato', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5; /* Um cinza bem claro, mais suave que o branco puro */
            color: #333;
            margin: 0;
            padding: 40px 20px; /* Adicionado mais espaço vertical */
            display: flex;
            flex-direction: column; /* Organiza os itens em coluna */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box; /* Garante que padding não afete a altura total */
        }

        /* O container principal que centraliza o conteúdo */
        .container {
            width: 90%;
            max-width: 800px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            border-top: 5px solid #0056b3; /* Um detalhe azul no topo */
        }

        /* Estilo do título principal */
        h1 {
            color: #1d3557; /* Azul escuro para o título */
            margin-bottom: 10px;
            font-weight: 700;
        }

        /* Estilo do parágrafo de introdução */
        p {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        /* Estilo da lista que segura os links */
        .links-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Estilo de cada item da lista (cada link) */
        .links-list li {
            margin-bottom: 15px;
        }

        /* Estilo dos links - a parte mais importante! */
        .links-list a {
            display: block;
            background-color: #e9f5ff; /* Um azul bem clarinho */
            color: #0056b3; /* Azul mais forte para o texto */
            padding: 18px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease; /* Transição suave para o hover */
            border: 1px solid #bde0fe;
        }

        /* Efeito visual ao passar o mouse sobre o link */
        .links-list a:hover {
            background-color: #0056b3; /* Fundo azul escuro */
            color: #ffffff; /* Texto branco */
            transform: translateY(-3px); /* Leve elevação */
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.2);
        }

        /* --- NOVO ESTILO PARA O RODAPÉ --- */
        .footer {
            margin-top: 40px; /* Espaço entre o container e o rodapé */
            text-align: center;
            font-size: 14px;
            color: #888; /* Cor cinza para não chamar muita atenção */
        }
        
    </style>
</head>
<body>

    <div class="container">
        <h1>Resumos de Anatomia Abdominal</h1>

            <li><a href="Circulação Abdominal.html">Circulação Abdominal</a></li>
        </ul>
    </div>

    <footer class="footer">
        <p>Elaborado por Ivael Silva - Aluno de Medicina da UNCISAL</p>
    </footer>

</body>
</html>
